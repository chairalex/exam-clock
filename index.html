<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Exam Clock</title>

    <script src="main.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />    
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/"
        }
      }
    </script>

    <script type="module">
      import '@material/web/all.js';
      import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

      document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    


  </head>
  <body>
    <md-dialog id="didnt_filled_in_all_things_dialog">
      <div slot="headline" style="font-family: 'Google Sans Flex';">
        Dialog title
      </div>
      <form slot="content" id="form-id" method="dialog" style="font-family: 'Google Sans Flex';">
        Please fill in both the start time and the end time!
      </form>
      <div slot="actions">
        <md-text-button form="form-id" style="font-family: 'Google Sans Flex';">Ok</md-text-button>
      </div>
    </md-dialog>

    <md-dialog id="invalid_time">
      <div slot="headline" style="font-family: 'Google Sans Flex';">
        Invalid Time
      </div>
      <form slot="content" id="form-id" method="dialog" style="font-family: 'Google Sans Flex';">
        Please enter a valid time.
      </form>
      <div slot="actions">
        <md-text-button form="form-id" style="font-family: 'Google Sans Flex';">Ok</md-text-button>
      </div>
    </md-dialog>

    <div id="inserting_time_session" class="inserting_time_session">
      <div class="parent_insert_panel">
        <md-outlined-text-field label="Subject Name (Optional)" class="subject_name" id="subject_name"></md-outlined-text-field>

        <span class="title_1 start_end">Start Time</span>
        <div class="insert_panel">
            <input class="time_insert_block" id="start_hr" inputmode="numeric" type="text" placeholder="00" maxlength="2">
            <span class="colon">:</span>
            <input class="time_insert_block" id="start_min" inputmode="numeric" type="text" placeholder="00" maxlength="2">
        </div>
        <span class="title_1 start_end">End Time</span>
        <div class="insert_panel">
            <input class="time_insert_block" id="end_hr" inputmode="numeric" type="text" placeholder="00" maxlength="2">
            <span class="colon">:</span>
            <input class="time_insert_block" id="end_min" inputmode="numeric" type="text" placeholder="00" maxlength="2">
        </div>

        <md-filled-button class="filled_button" id="start_button">
          <md-icon>play_arrow</md-icon>
        </md-filled-button>

      </div>
    </div>

    <div id="actual_session">
      
        <md-icon-button class="back_button" id="back_button">
          <md-icon>arrow_back</md-icon>
        </md-icon-button>

        <md-icon-button class="fullscreen_button" id="fullscreen_button">
          <md-icon id="fullscreen_icon"></md-icon>
        </md-icon-button>
      <div class="testing">
        <span id="subject_name_display" class="subject_name_display"></span>

        <div class="display_area">
          <div class="each_time">
            <span id="showing_start_hr" class="time_display"></span>
            <span class="colon">:</span>
            <span id="showing_start_min" class="time_display"></span>
          </div>

          <span class="dash colon"> – </span>

          <div class="each_time">
            <span id="showing_end_hr" class="time_display"></span>
            <span class="colon">:</span>
            <span id="showing_end_min" class="time_display"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
