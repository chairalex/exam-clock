<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Exam Clock</title>

    <script src="main.js" defer></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />    
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/"
        }
      }
    </script>

    <script type="module">
      import '@material/web/all.js';
      import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

      document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    


  </head>
  <body>
    <div id="buttons">
      <md-icon-button class="back_button" id="back_button">
        <md-icon>arrow_back</md-icon>
      </md-icon-button>

      <div class="right_buttons">
        <md-icon-button id="more_options_button" style="display: none;">
          <md-icon>more_vert</md-icon>
        </md-icon-button>

        <md-icon-button class="" id="fullscreen_button">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fullscreen_icon" id="fullscreen"><path d="M120-120v-200h80v120h120v80H120Zm520 0v-80h120v-120h80v200H640ZM120-640v-200h200v80H200v120h-80Zm640 0v-120H640v-80h200v200h-80Z"/></svg>
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fullscreen_icon" id="fullscreen_exit"><path d="M240-120v-120H120v-80h200v200h-80Zm400 0v-200h200v80H720v120h-80ZM120-640v-80h120v-120h80v200H120Zm520 0v-200h80v120h120v80H640Z"/></svg>
        </md-icon-button>

        <button class="universal_button_nonmd" id="universal_button_nonmd">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fullscreen_icon" id="fullscreen1"><path d="M120-120v-200h80v120h120v80H120Zm520 0v-80h120v-120h80v200H640ZM120-640v-200h200v80H200v120h-80Zm640 0v-120H640v-80h200v200h-80Z"/></svg>
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fullscreen_icon" id="fullscreen_exit1"><path d="M240-120v-120H120v-80h200v200h-80Zm400 0v-200h200v80H720v120h-80ZM120-640v-80h120v-120h80v200H120Zm520 0v-200h80v120h120v80H640Z"/></svg>
        </button>

        


      </div>

    </div>



    <md-dialog id="more_options">
      <div slot="headline" style="font-family: 'Google Sans Flex';">
        More options
      </div>
      <form slot="content" id="form-id" method="dialog" style="font-family: 'Google Sans Flex';">
        <label>
          <span class="boolean_button_text">Stopwatch</span>
          <md-switch></md-switch>
        </label>
      </form>
      <div slot="actions">
        <md-text-button form="form-id" style="font-family: 'Google Sans Flex';">Ok</md-text-button>
      </div>
    </md-dialog>


    <md-dialog id="didnt_filled_in_all_things_dialog">
      <div slot="headline" style="font-family: 'Google Sans Flex';">
        Missing Information
      </div>
      <form slot="content" id="form-id" method="dialog" style="font-family: 'Google Sans Flex';">
        Please fill in both the start time and the end time!
      </form>
      <div slot="actions">
        <md-text-button form="form-id" style="font-family: 'Google Sans Flex';">Ok</md-text-button>
      </div>
    </md-dialog>

    <md-dialog id="invalid_time">
      <div slot="headline" style="font-family: 'Google Sans Flex';">
        Invalid Time
      </div>
      <form slot="content" id="form-id" method="dialog" style="font-family: 'Google Sans Flex';">
        Please enter a valid time.
      </form>
      <div slot="actions">
        <md-text-button form="form-id" style="font-family: 'Google Sans Flex';">Ok</md-text-button>
      </div>
    </md-dialog>

    <div id="for_scaling">
      <div id="inserting_time_session" class="inserting_time_session">
        <div class="parent_insert_panel">
          <md-outlined-text-field label="Subject Name (Optional)" class="subject_name" id="subject_name"></md-outlined-text-field>
          
          <div class='subject_input_nonmd' id="subject_input_nonmd">
          <span class="title_2 start_end">Subject Name (Optional)</span>
          <input class="subject_name subject_name_nonmd" id="subject_input_nonmd_area">
          </div>

          <span class="title_1 start_end">Start Time</span>
          <div class="insert_panel">
              <input class="time_insert_block" id="start_hr" inputmode="numeric" type="text" placeholder="00" maxlength="2">
              <span class="colon">:</span>
              <input class="time_insert_block" id="start_min" inputmode="numeric" type="text" placeholder="00" maxlength="2">
          </div>
          <span class="title_1 start_end">End Time</span>
          <div class="insert_panel">
              <input class="time_insert_block" id="end_hr" inputmode="numeric" type="text" placeholder="00" maxlength="2">
              <span class="colon">:</span>
              <input class="time_insert_block" id="end_min" inputmode="numeric" type="text" placeholder="00" maxlength="2">
          </div>

          <md-filled-button class="filled_button" id="start_button">
            <svg xmlns="http://www.w3.org/2000/svg" height="64px" viewBox="0 -960 960 960" width="64px" class="play_icon"><path d="M320-200v-560l440 280-440 280Z"/></svg>
          </md-filled-button>

          <button class="start_button_nonmd" id="start_button_nonmd">
            <svg xmlns="http://www.w3.org/2000/svg" height="64px" viewBox="0 -960 960 960" width="64px" class="play_icon"><path d="M320-200v-560l440 280-440 280Z"/></svg>
          </button>

        </div>
      </div>

      <div id="actual_session">

          <button class="back_button universal_button_nonmd" id="back_button1">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fullscreen_icon"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
          </button>


        <div class="testing">
          <span id="subject_name_display" class="subject_name_display"></span>
            <div class="all_boxes">
            <div class="display_area">
              <div class="each_time">
                <span id="showing_start_hr" class="time_display"></span>
                <span class="colon">:</span>
                <span id="showing_start_min" class="time_display"></span>
              </div>

              <span class="dash colon"> – </span>

              <div class="each_time">
                <span id="showing_end_hr" class="time_display"></span>
                <span class="colon">:</span>
                <span id="showing_end_min" class="time_display"></span>
              </div>
            </div>

            <div id="timer" class="display_area stopwatch_box">
                  <span id="timer_hr" class="stopwatch_text"></span>
                  <span class="colon">:</span>
                  <span id="timer_min" class="stopwatch_text"></span>
                  <span class="colon">:</span>
                  <span id="timer_sec" class="stopwatch_text"></span>
                  <span class="colon">:</span>
                  <span id="timer_millisec" class="stopwatch_text"></span>
            </div>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
