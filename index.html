<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Exam Clock</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/"
        }
      }
    </script>

    <script type="module">
      import '@material/web/all.js';
      import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

      document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    


  </head>
  <body>
    <div class="parent_insert_panel">
      <h1 class="md-typescale-display-medium-'Google Sans Flex'">Start Time</h1>
      <div class="insert_panel">
          <input class="time_insert_block" inputmode="numeric" type="text" placeholder="00" maxlength="2">
          <input class="time_insert_block" inputmode="numeric" type="text" placeholder="00" maxlength="2">
      </div>
      <h1 class="md-typescale-display-medium-'Google Sans Flex'">End Time</h1>
      <div class="insert_panel">
          <input class="time_insert_block" inputmode="numeric" type="text" placeholder="00" maxlength="2">
          <input class="time_insert_block" inputmode="numeric" type="text" placeholder="00" maxlength="2">
      </div>

      <md-filled-button style="font-family: 'Google Sans Flex';">Start</md-filled-button>
    </div>
  </body>
</html>
